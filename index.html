<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17223c"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>Gruppcentralen</title></head><body><div class="app"><aside><b class="brand">GC Gruppcentralen</b><nav><button data-v="groups" class="active">👥 Elevgrupper</button><button data-v="random">🎲 Slumpa</button><button data-v="rooms">🪑 Klassrum</button><button data-v="backup">💾 Import & backup</button></nav></aside><main><header><div><h1 id="title">Elevgrupper</h1><p id="sub">Hantera grupper lokalt på enheten.</p></div><span>4.2</span></header><div id="toast"></div>
<section id="groups" class="view"><div class="bar"><input id="search" placeholder="Sök grupp eller elev"><button class="primary" onclick="openGroup()">+ Ny grupp</button></div><div id="groupCards" class="cards"></div></section>
<section id="random" class="view hide"><div class="card"><h2>Välj elevgrupper</h2><div id="randomChecks" class="checks"></div><div class="footer"><span id="randomInfo"></span><button class="primary" onclick="randomize()">🎲 Grupper om 3</button></div></div><div id="randomResult" class="results"></div></section>
<section id="rooms" class="view hide"><div id="roomList"><div class="bar"><div><h2>Mina klassrum</h2><p>Bygg rummet och skapa bordsplaceringar.</p></div><button class="primary" onclick="newRoom()">+ Nytt klassrum</button></div><div id="roomCards" class="cards"></div></div><div id="editor" class="hide"><div class="editorbar"><button class="soft" onclick="closeEditor()">← Klassrum</button><input id="roomName" value="Nytt klassrum"><button class="soft" onclick="saveRoom()">Spara</button><button class="primary" onclick="seatStudents()">Placera elever</button></div><div class="builder"><div class="tools card"><h3>Lägg till</h3><button onclick="addTable('rect')">▭ Rektangulärt<br><small>2–6 platser</small></button><button onclick="addTable('square')">□ Enskilt<br><small>1 plats</small></button><button onclick="addTable('round')">○ Runt<br><small>2–6 platser</small></button><h3>Rummet</h3><button onclick="addObject('board')">+ Whiteboard</button><button onclick="addObject('door')">+ Dörr</button><p><b id="stats"></b></p></div><div class="stage"><div id="canvas" class="canvas"></div></div><div id="inspect" class="card inspect">Välj en figur.</div></div></div><div id="seater" class="hide"><div class="editorbar"><button class="soft" onclick="backEditor()">← Redigera rum</button><strong id="seatTitle"></strong><button class="primary" onclick="doSeating()">↻ Slumpa placering</button><button class="soft" onclick="print()">Skriv ut</button></div><div id="seatChooser" class="card"><h2>Välj elevgrupper</h2><div id="seatChecks" class="checks"></div><div id="attendance" class="chips"></div><button class="primary" onclick="doSeating()">Skapa placering</button></div><div class="stage seatstage"><div id="seatCanvas" class="canvas"></div></div></div></section>
<section id="backup" class="view hide"><div class="imports"><div class="card center"><h2>📄 Word</h2><p>Importera tabeller från .docx.</p><button class="primary" onclick="wordFile.click()">Välj Word</button><input id="wordFile" hidden type="file" accept=".docx"></div><div class="card center"><h2>💾 Backup</h2><p>Flytta grupper och klassrum.</p><button class="primary" onclick="exportData()">Exportera</button><button class="soft" onclick="backupFile.click()">Importera</button><input id="backupFile" hidden type="file" accept=".json"></div></div></section></main></div>
<div id="modal" class="modal hide"><div class="dialog"><button class="x" onclick="closeGroup()">×</button><h2 id="modalTitle">Ny grupp</h2><label>Årskurs</label><input id="gGrade"><label>Kategori</label><input id="gCat"><label>Gruppnamn</label><input id="gName"><label>Elever, ett namn per rad</label><textarea id="gStudents"></textarea><button class="primary" onclick="saveGroup()">Spara grupp</button></div></div><script src="jszip.min.js"></script><script src="app.js"></script></body></html>
